server {
    listen 80;
    server_name _;

    # â”€â”€â”€ Frontend (archivos estÃ¡ticos de Vite) â”€â”€â”€
    root C:/nginx/html;
    index index.html;

    # CompresiÃ³n gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # â”€â”€â”€ Proxy API â†’ Backend NestJS â”€â”€â”€
    # El frontend llama a /api/... y Nginx lo reenvÃ­a a NestJS sin el /api
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout largo para uploads de imÃ¡genes + Gemini
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10M;
    }

    # â”€â”€â”€ Webhooks (no tienen /api prefix) â”€â”€â”€
    location /webhooks/ {
        proxy_pass http://api:3000/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # â”€â”€â”€ SPA fallback â†’ React Router â”€â”€â”€
    location / {
        try_files $uri $uri/ /index.html;
    }

    # â”€â”€â”€ Cache de assets estÃ¡ticos â”€â”€â”€
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
