services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.windows
      target: api
      args:
        NODE_VERSION: "22.16.0"
    image: cajamenor-api:windows
    container_name: cajamenor-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - type: volume
        source: api-uploads
        target: C:\app\uploads
      - type: bind
        source: ./logs/api
        target: C:\logs

  web:
    build:
      context: .
      dockerfile: Dockerfile.windows
      target: web
      args:
        NGINX_VERSION: "1.30.2"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID}"
    image: cajamenor-web:windows
    container_name: cajamenor-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - type: bind
        source: ./logs/web
        target: C:\nginx\logs
    depends_on:
      - api

volumes:
  api-uploads: