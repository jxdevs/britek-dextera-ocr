# ═══════════════════════════════════════════════════════════════════
# Docker Compose — Producción (EC2)
#
# Uso:
#   1. Clonar el repo en la EC2
#   2. Copiar .env.production con las variables de producción
#   3. docker compose -f docker-compose.prod.yml up -d --build
#
# Arquitectura:
#   Puerto 80 → Nginx → sirve frontend estático
#                     → proxy /api/ → NestJS (puerto 3000 interno)
# ═══════════════════════════════════════════════════════════════════

services:

  # ─── Backend NestJS ───
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cajamenor-api
    restart: unless-stopped
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    volumes:
      - web-dist:/app/apps/web/dist
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Nginx (Frontend + Reverse Proxy) ───
  web:
    image: nginx:alpine
    container_name: cajamenor-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - web-dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  web-dist:
